<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.2rem; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem; align-items: center; }
  .controls input[type=text] { flex: 1; min-width: 180px; padding: 8px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a1a; outline: none; }
  .controls input[type=text]:focus { border-color: #888; }
  .controls select { padding: 8px 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a1a; cursor: pointer; outline: none; }

  /* Buttons */
  .btn { padding: 8px 14px; font-size: 13px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
  .btn-primary { background: #2c5f2e; color: #fff; }
  .btn-primary:hover { background: #224a24; }
  .btn-danger { background: #fee2e2; color: #b91c1c; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

  .stats { font-size: 13px; color: #888; margin-bottom: 0.75rem; }

  /* Table */
  .table-wrap { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: #888; padding: 10px 10px; border-bottom: 1px solid #eee; cursor: pointer; user-select: none; white-space: nowrap; background: #fafaf8; }
  th.no-sort { cursor: default; }
  th:not(.no-sort):hover { color: #333; }
  .sort-arrow { margin-left: 3px; opacity: 0.4; }
  th.active .sort-arrow { opacity: 1; color: #333; }
  td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }

  /* Editable cells */
  td[contenteditable=true] { outline: none; cursor: text; border-radius: 4px; }
  td[contenteditable=true]:focus { background: #fffbe6; box-shadow: inset 0 0 0 1.5px #f59e0b; }

  /* Badges */
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; cursor: pointer; user-select: none; }
  .badge-fiction { background: #eeedfe; color: #3c3489; }
  .badge-nonfiction { background: #e1f5ee; color: #085041; }

  /* Read toggle */
  .read-toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer; user-select: none; white-space: nowrap; border: none; background: none; }
  .read-toggle.read { background: #dbeafe; color: #1d4ed8; }
  .read-toggle.want { background: #fef9c3; color: #92400e; }

  /* Add book modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { font-size: 1.1rem; margin-bottom: 1.25rem; }
  .form-row { margin-bottom: 1rem; }
  .form-row label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
  .form-row input, .form-row select { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
  .form-row input:focus, .form-row select:focus { border-color: #888; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.25rem; }
  .btn-cancel { background: #f3f4f6; color: #333; }
  .btn-cancel:hover { background: #e5e7eb; }

  /* Export */
  .top-actions { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }

  .del-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 16px; padding: 2px 6px; border-radius: 4px; line-height: 1; }
  .del-btn:hover { color: #ef4444; background: #fee2e2; }

  select.type-select { font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 20px; border: none; cursor: pointer; outline: none; }
  select.type-select.fiction { background: #eeedfe; color: #3c3489; }
  select.type-select.nonfiction { background: #e1f5ee; color: #085041; }
  .sort-builder { background:#fff; border:1px solid #e5e5e5; padding:12px; border-radius:10px; margin-bottom:12px; font-size:13px; }
  .sort-builder strong { display:block; margin-bottom:8px; }
  .sort-builder .sort-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .sort-builder select, .priority-select { border:1px solid #ddd; border-radius:7px; padding:5px; background:white; font-size:12px; }
  .sort-builder .btn { background:#f3f4f6; color:#333; margin-right:6px; }
  .priority-select { width:100%; min-width:82px; }
  .priority-select.next { background:#dcfce7; color:#166534; font-weight:700; }
  .priority-select.high { background:#fef3c7; color:#92400e; }
  .priority-select.low { color:#777; }
</style>
</head>

  <div class="top-actions">

  </div>

  </div>
  <div class="sort-builder" id="sort-builder"><strong>Sort by</strong><div id="sort-rows"></div><button class="btn btn-sm" onclick="addSortLevel()">+ Add sort column</button><button class="btn btn-sm" onclick="resetSort()">Reset sort</button></div>
  <div class="stats" id="stats"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:28%" onclick="sort('title')">Title <span class="sort-arrow" id="arr-title">↕</span></th>
          <th style="width:18%" onclick="sort('author')">Author <span class="sort-arrow" id="arr-author">↕</span></th>

          <th style="width:12%" onclick="sort('status')">Status <span class="sort-arrow" id="arr-status">↕</span></th>
          <th onclick="sort('priority')">Priority <span class="sort-arrow" id="arr-priority">↕</span></th>
          <th style="width:3%" class="no-sort"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Add Book Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Add a Book</h2>
    <div class="form-row"><label>Title *</label><input type="text" id="f-title" placeholder="Book title" /></div>
    <div class="form-row"><label>Author</label><input type="text" id="f-author" placeholder="Author name" /></div>
    <div class="form-row"><label>Type</label>

    </div>
    <div class="form-row"><label>Genre</label><input type="text" id="f-genre" placeholder="e.g. History, Self-Help, Fantasy" /></div>
    <div class="form-row"><label>Recommended By</label><input type="text" id="f-rec" placeholder="e.g. Ryan Holiday, Shelly's dad…" /></div>
    <div class="form-row"><label>Status</label>
      <select id="f-status"><option value="Want to Read">Want to Read</option><option value="Read">Read</option></select>
    </div>
    <div class="form-row"><label>Priority</label><select id="f-priority"><option>None</option><option>Next</option><option>High</option><option>Medium</option><option>Low</option></select></div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addBook()">Add Book</button>
    </div>
  </div>
</div>

// Load from localStorage if available
function loadFromStorage() {
  try {
    const saved = localStorage.getItem('myBookList');
    if (saved) {
      const data = JSON.parse(saved);
      if (Array.isArray(data.books) && data.books.length > 0) books = data.books;
      books.forEach(b => { if (!b.priority) b.priority = 'None'; });
      nextId = Math.max(data.nextId || 99, ...books.map(b => (Number(b.id) || 0) + 1));
    }
  } catch(e) {}
}

    const s = document.getElementById('save-status');
    s.textContent = '✓ Saved!';
    setTimeout(() => s.textContent = '', 2500);
  } catch(e) {
    alert('Could not save — localStorage may be unavailable in this environment. Use Export CSV to save your data.');
  }
}

loadFromStorage();

// Genre filter
function refreshGenreFilter() {
  const genres = [...new Set(books.map(b => b.genre))].sort();
  const sel = document.getElementById('filter-genre');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All genres</option>';
  genres.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; if(g===cur) o.selected=true; sel.appendChild(o); });
}

function sort(col) {
  const current = sortLevels[0];
  sortLevels = [{col,dir:current && current.col===col ? -current.dir : 1}];
  renderSortBuilder(); render();
}
function addSortLevel() {
  const available = sortFields.find(c=>!sortLevels.some(l=>l.col===c));
  if (available) { sortLevels.push({col:available,dir:1}); renderSortBuilder(); render(); }
}
function changeSortLevel(i, key, value) {
  if (key==='col' && sortLevels.some((l,j)=>j!==i && l.col===value)) return;
  sortLevels[i][key] = key==='dir' ? Number(value) : value;
  renderSortBuilder(); render();
}
function removeSortLevel(i) { sortLevels.splice(i,1); if (!sortLevels.length) sortLevels=[{col:'title',dir:1}]; renderSortBuilder(); render(); }
function resetSort() { sortLevels=[{col:'title',dir:1}]; renderSortBuilder(); render(); }
function renderSortBuilder() {
  document.getElementById('sort-rows').innerHTML = sortLevels.map((l,i)=>`<div class="sort-row"><span>${i+1}.</span><select aria-label="Sort column ${i+1}" onchange="changeSortLevel(${i},'col',this.value)">${sortFields.map(c=>`<option value="${c}" ${l.col===c?'selected':''} ${sortLevels.some((v,j)=>j!==i&&v.col===c)?'disabled':''}>${sortLabels[c]}</option>`).join('')}</select><select aria-label="Sort direction ${i+1}" onchange="changeSortLevel(${i},'dir',this.value)"><option value="1" ${l.dir===1?'selected':''}>${l.col==='priority'?'Next first':'A → Z / Ascending'}</option><option value="-1" ${l.dir===-1?'selected':''}>${l.col==='priority'?'None first':'Z → A / Descending'}</option></select><button class="btn btn-sm" onclick="removeSortLevel(${i})" aria-label="Remove sort level">×</button></div>`).join('');
  sortFields.forEach(c=>{const el=document.getElementById('arr-'+c); if(!el)return; const i=sortLevels.findIndex(l=>l.col===c); el.textContent=i<0?'↕':`${sortLevels[i].dir===1?'↑':'↓'}${i+1}`; el.parentElement.classList.toggle('active',i>=0);});
}
function setPriority(id, priority) { const b=books.find(x=>x.id===id); if(!b)return; b.priority=priority; render(); }
function compareBooks(a,b,col) {
  if(col==='priority') return priorityOrder[a.priority||'None']-priorityOrder[b.priority||'None'];
  return String(a[col]||'').localeCompare(String(b[col]||''),undefined,{numeric:true,sensitivity:'base'});
}

function toggleStatus(id) {
  const b = books.find(x => x.id === id);
  if (!b) return;
  b.status = b.status === 'Read' ? 'Want to Read' : 'Read';
  render();
}

function toggleType(id) {
  const b = books.find(x => x.id === id);
  if (!b) return;
  b.type = b.type === 'Fiction' ? 'Nonfiction' : 'Fiction';
  render();
}

function deleteBook(id) {
  if (!confirm('Remove this book from the list?')) return;
  books = books.filter(x => x.id !== id);
  refreshGenreFilter();
  render();
}

function editCell(id, field, el) {
  const b = books.find(x => x.id === id);
  if (!b) return;
  b[field] = el.textContent.trim();
  if (field === 'genre') refreshGenreFilter();
}

function escapeHTML(v) {return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const typeF = document.getElementById('filter-type').value;
  const genreF = document.getElementById('filter-genre').value;
  const statusF = document.getElementById('filter-status').value;
  const priorityF = document.getElementById('filter-priority').value;

  let filtered = books.filter(b => {
    if (typeF && b.type !== typeF) return false;
    if (genreF && b.genre !== genreF) return false;
    if (statusF && b.status !== statusF) return false;
    if (priorityF && (b.priority||'None') !== priorityF) return false;
    if (q && !b.title.toLowerCase().includes(q) && !b.author.toLowerCase().includes(q) && !b.rec.toLowerCase().includes(q)) return false;
    return true;
  });

  filtered.sort((a,b)=>{for(const l of sortLevels){const cmp=compareBooks(a,b,l.col); if(cmp)return cmp*l.dir;}return a.id-b.id;});
  renderSortBuilder();

  const readCount = books.filter(b => b.status === 'Read').length;
  document.getElementById('subtitle').textContent = `${books.length} books · ${readCount} read · ${books.length - readCount} to read`;
  document.getElementById('stats').textContent = `Showing ${filtered.length} of ${books.length} books`;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = filtered.map(b => `
    <tr>
      <td contenteditable="true" onblur="editCell(${b.id},'title',this)" style="font-weight:500">${escapeHTML(b.title)}</td>
      <td contenteditable="true" onblur="editCell(${b.id},'author',this)" style="color:#555">${escapeHTML(b.author)}</td>
      <td>
        <span class="badge badge-${b.type==='Fiction'?'fiction':'nonfiction'}" onclick="toggleType(${b.id})" title="Click to toggle">${b.type}</span>
      </td>
      <td contenteditable="true" onblur="editCell(${b.id},'genre',this)" style="color:#777;font-size:12px">${escapeHTML(b.genre)}</td>
      <td contenteditable="true" onblur="editCell(${b.id},'rec',this)" style="color:#777;font-size:12px">${escapeHTML(b.rec)}</td>
      <td>
        <button class="read-toggle ${b.status==='Read'?'read':'want'}" onclick="toggleStatus(${b.id})" title="Click to toggle">
          ${b.status==='Read'?'✅ Read':'🔖 Want to Read'}
        </button>
      </td>
      <td><select class="priority-select ${(b.priority||'None').toLowerCase()}" aria-label="Priority for ${escapeHTML(b.title)}" onchange="setPriority(${b.id},this.value)">${['None','Next','High','Medium','Low'].map(p=>`<option ${b.priority===p?'selected':''}>${p}</option>`).join('')}</select></td>
      <td><button class="del-btn" onclick="deleteBook(${b.id})" title="Remove book">×</button></td>
    </tr>`).join('');
}

// Modal
function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-title').focus();
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  ['f-title','f-author','f-genre','f-rec'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-type').value = 'Nonfiction';
  document.getElementById('f-status').value = 'Want to Read';
  document.getElementById('f-priority').value = 'None';
}
document.getElementById('modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

function addBook() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  books.push({
    id: nextId++,
    title,
    author: document.getElementById('f-author').value.trim(),
    type: document.getElementById('f-type').value,
    genre: document.getElementById('f-genre').value.trim() || 'Uncategorized',
    rec: document.getElementById('f-rec').value.trim(),
    status: document.getElementById('f-status').value,
    priority: document.getElementById('f-priority').value,
  });
  refreshGenreFilter();
  render();
  closeModal();
}

// Export CSV
function exportCSV() {
  const headers = ['Title','Author','Type','Genre','Recommended By','Status','Priority'];
  const rows = books.map(b => [b.title, b.author, b.type, b.genre, b.rec, b.status, b.priority||'None'].map(v => `"${(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'my_book_list.csv';
  a.click();
}

// Keyboard shortcut: Escape closes modal
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

refreshGenreFilter();
render();
</script>
</body>
